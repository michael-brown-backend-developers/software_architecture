[project]
name = "stagedoor"
version = "0.1.0"
description = "A small box office, built to be changed."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "fastapi[standard] (>=0.120,<1.0)",
]

[project.scripts]
stagedoor = "stagedoor.entrypoints.cli:main"

[tool.poetry]
packages = [
    { include = "stagedoor", from = "src" },
    { include = "fakestripe", from = "src" },
    { include = "fakepaypal", from = "src" },
    { include = "fakevenue", from = "src" },
    { include = "fakewallet", from = "src" },
    { include = "fakeroyalmail", from = "src" },
    { include = "fakemailer", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 79  # listings must fit the printed page
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# They live in src/, but they stand in for other people's libraries.
known-third-party = [
    "fakestripe",
    "fakepaypal",
    "fakevenue",
    "fakewallet",
    "fakeroyalmail",
    "fakemailer",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "httpx2 (>=2.13,<3.0)",
    "import-linter (>=2.0,<3.0)"
]

[tool.importlinter]
root_package = "stagedoor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Every dependency points inwards"
type = "layers"
layers = [
    "stagedoor.entrypoints",
    "stagedoor.adapters",
    "stagedoor.application",
    "stagedoor.domain",
]

[[tool.importlinter.contracts]]
name = "The inside uses nobody else's libraries"
type = "forbidden"
source_modules = ["stagedoor.domain", "stagedoor.application"]
forbidden_modules = [
    "sqlalchemy",
    "psycopg",
    "fastapi",
    "pydantic",
    "fakestripe",
    "fakepaypal",
    "fakevenue",
    "fakewallet",
    "fakeroyalmail",
    "fakemailer",
]
